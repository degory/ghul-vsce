# CI/CD pipeline.

name: CI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: true

  pull_request:
  push:
    branches: [main]

# Serialise pushes to main so two concurrent merges don't compute the same
# version number; for pull requests, cancel any superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true

jobs:
  version:
    name: Create a version number
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      package: ${{ steps.version.outputs.package }}

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    # Compute the next version: the patch bump of the latest vX.Y.Z tag, unless
    # the checked-in VERSION file declares a higher minor/major floor. VERSION
    # is code-owned, so raising it for a non-patch release requires the code
    # owner's review (a #major/#minor marker can no longer trigger a bump). A
    # workflow_dispatch `version` input overrides outright; pull request builds
    # get a -beta.<run> prerelease so they never collide with a real release.
    - name: Determine the version
      id: version
      uses: degory/create-version@v1.0.0
      with:
        version: ${{ github.event.inputs.version }}
        prerelease: ${{ github.event_name == 'pull_request' && format('beta.{0}', github.run_number) || '' }}

  unit_tests:
    name: Run unit tests
    needs: [version]
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
    - name: Setup NodeJS
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'

    - uses: actions/checkout@v7

    - name: Install dependencies
      run: npm install

    - name: Set version number in all package.json files
      run: |
        npm version --no-git-tag-version --allow-same-version ${{ needs.version.outputs.package }}
        pushd server ; npm version --no-git-tag-version --allow-same-version ${{ needs.version.outputs.package }} ; popd
        pushd client ; npm version --no-git-tag-version --allow-same-version ${{ needs.version.outputs.package }} ; popd
        pushd language-server ; npm version --no-git-tag-version --allow-same-version ${{ needs.version.outputs.package }} ; popd

    - name: Run tests
      run: npm test

  integration_tests:
    name: Run integration tests
    needs: [version]
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
    - name: Setup NodeJS
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - uses: actions/checkout@v7

    - name: Install dependencies
      run: npm install

    # Drives the real webpacked server.js against a real ghūl project and a
    # real ghul.compiler child process — the end-to-end path every other
    # test in this repo mocks out. See server/integration-tests/.
    - name: Run integration tests
      run: npm run test:integration

  code_review:
    name: Code review
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: degory/ghul-code-review/.github/workflows/review.yml@v2
    with:
      model: ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-opus-5' }}
      idle-timeout-seconds: ${{ fromJSON(vars.CLAUDE_REVIEW_IDLE_TIMEOUT_SECONDS || '90') }}
      max-attempts: ${{ fromJSON(vars.CLAUDE_REVIEW_MAX_ATTEMPTS || '3') }}
      gh-app-id: ${{ vars.GHUL_REVIEWER_APP_ID }}
      prompt: |
        Review pull request #${{ github.event.pull_request.number }} on ${{ github.repository }}.

        You run in parallel with CI. Whether the TypeScript compiles, the unit tests pass, and the beta package builds is gated by CI before merge — that's not your job. Trust the diff as written.

        Read this file first:
        1. .github/claude-review.md — what this repo is, and what to watch for in it
    secrets:
      claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      gh-app-private-key: ${{ secrets.GHUL_REVIEWER_PRIVATE_KEY }}

  upload_beta_package:
    needs: [version, unit_tests, integration_tests]
    name: Publish beta package

    timeout-minutes: 5

    runs-on: ubuntu-latest

    if: ${{ github.event_name == 'pull_request' }}
    steps:
    - name: Setup NodeJS
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'

    - uses: actions/checkout@v7

    - name: Install dependencies
      run: npm install

    - name: Set version number in all package.json files
      run: |
        npm version --no-git-tag-version --allow-same-version ${{ needs.version.outputs.package }}
        pushd server ; npm version --no-git-tag-version --allow-same-version ${{ needs.version.outputs.package }} ; popd
        pushd client ; npm version --no-git-tag-version --allow-same-version ${{ needs.version.outputs.package }} ; popd
        pushd language-server ; npm version --no-git-tag-version --allow-same-version ${{ needs.version.outputs.package }} ; popd

    - name: Build VSCE package
      run: npx @vscode/vsce package

    - name: Build standalone language server package
      run: npm run package:language-server

    - name: Upload beta VSCE package artifact to GitHub
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: vsce-package
        path: ghul-${{ needs.version.outputs.package }}.vsix

    - name: Upload beta language server package artifact to GitHub
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: language-server-package
        path: ghul-language-server-${{ needs.version.outputs.package }}.tgz

  publish_release_package:
    needs: [version, unit_tests, integration_tests]
    name: Publish release package

    timeout-minutes: 5

    runs-on: ubuntu-latest

    # if push and branch is main
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    # Read at step level to gate the npm publish: the npm registry is
    # optional, and until a token is configured the rest of the release
    # still has to go out.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
    - name: Setup NodeJS
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'

    - uses: actions/checkout@v7

    - name: Install dependencies
      run: npm install

    - name: Set version number in all package.json files
      run: |
        npm version --no-git-tag-version --allow-same-version ${{ needs.version.outputs.package }}
        pushd server ; npm version --no-git-tag-version --allow-same-version ${{ needs.version.outputs.package }} ; popd
        pushd client ; npm version --no-git-tag-version --allow-same-version ${{ needs.version.outputs.package }} ; popd
        pushd language-server ; npm version --no-git-tag-version --allow-same-version ${{ needs.version.outputs.package }} ; popd

    - name: Build VSCE package
      run: npx @vscode/vsce package

    - name: Build standalone language server package
      run: npm run package:language-server

    - name: Upload release VSCE package artifact to GitHub
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: vsce-package
        path: ghul-${{ needs.version.outputs.package }}.vsix

    - name: Upload release language server package artifact to GitHub
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: language-server-package
        path: ghul-language-server-${{ needs.version.outputs.package }}.tgz

    - name: VSCE publish
      run: npx @vscode/vsce publish -p ${{ secrets.VSCE_PAT }}

    - name: Open VSX publish
      run: npx ovsx publish "ghul-${{ needs.version.outputs.package }}.vsix" -p ${{ secrets.OPEN_VSX_PAT }}

    - name: npm publish
      if: ${{ env.NPM_TOKEN != '' }}
      run: |
        npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
        npm publish --access public "ghul-language-server-${{ needs.version.outputs.package }}.tgz"

    - name: Skipping npm publish
      if: ${{ env.NPM_TOKEN == '' }}
      run: |
        echo "NPM_TOKEN is not configured, so the language server was not published to npm"

  create_release:
    needs: [version, unit_tests, integration_tests, publish_release_package]
    name: Create release
    runs-on: ubuntu-latest

    timeout-minutes: 5
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    permissions:
      contents: 'write'

    steps:
    - uses: actions/checkout@v7

    - name: Create changelog
      run: git log -1 --format="%s%n%n%b%n%n" >changelog.txt

    - name: Download release VSCE package artifact from GitHub
      uses: actions/download-artifact@v8
      with:
        name: vsce-package

    - name: Download release language server package artifact from GitHub
      uses: actions/download-artifact@v8
      with:
        name: language-server-package

    - name: Create release and upload packages
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ needs.version.outputs.tag }}" \
          --title "${{ needs.version.outputs.tag }}" \
          --notes-file changelog.txt \
          "ghul-${{ needs.version.outputs.package }}.vsix" \
          "ghul-language-server-${{ needs.version.outputs.package }}.tgz"
