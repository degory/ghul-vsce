# CI/CD pipeline.

name: CI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: true

  pull_request:
  push:
    branches: [main]

env:
  CI: true

jobs:
  version:
    name: Create a version number
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      tag: ${{ steps.package_version.outputs.tag }}
      package: ${{ steps.package_version.outputs.package }}

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: '0'

    # Calculates the next version from the git history. This action only
    # reads the repository - it never creates tags or releases. The next
    # version is a major/minor/patch bump of the most recent vX.Y.Z tag;
    # a #major or #minor marker in a commit subject picks the bump level,
    # otherwise each commit bumps the patch number.
    - name: Calculate the semantic version
      id: semver
      uses: paulhatch/semantic-version@v6.0.2
      with:
        tag_prefix: 'v'
        major_pattern: '#major'
        minor_pattern: '#minor'
        version_format: '${major}.${minor}.${patch}'

    - name: Determine the package version
      id: package_version
      run: |
        manual="${{ github.event.inputs.version }}"
        if [ -n "$manual" ]; then
          # version supplied via the workflow_dispatch input
          package="${manual#v}"
        else
          package="${{ steps.semver.outputs.version }}"
          # pull request builds get a prerelease version so they can
          # never collide with a real release
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            package="${package}-beta.${{ github.run_number }}"
          fi
        fi
        echo "tag=v${package}" >> "$GITHUB_OUTPUT"
        echo "package=${package}" >> "$GITHUB_OUTPUT"
        echo "Version: v${package}"

  unit_tests:
    name: Run unit tests
    needs: [version]
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
    - name: Setup NodeJS
      uses: actions/setup-node@v6
      with:
        node-version: 'lts/*'

    - uses: actions/checkout@v6

    - name: Install dependencies
      run: npm install

    - name: Set version number in all package.json files
      run: |
        npm version --no-git-tag-version --allow-same-version ${{ needs.version.outputs.package }}
        pushd server ; npm version --no-git-tag-version --allow-same-version ${{ needs.version.outputs.package }} ; popd
        pushd client ; npm version --no-git-tag-version --allow-same-version ${{ needs.version.outputs.package }} ; popd

    - name: Run tests
      run: npm test

  upload_beta_package:
    needs: [version, unit_tests]
    name: Publish beta package

    timeout-minutes: 5

    runs-on: ubuntu-latest

    if: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
    steps:
    - name: Setup NodeJS
      uses: actions/setup-node@v6
      with:
        node-version: 'lts/*'

    - uses: actions/checkout@v6

    - name: Install dependencies
      run: npm install

    - name: Set version number in all package.json files
      run: |
        npm version --no-git-tag-version --allow-same-version ${{ needs.version.outputs.package }}
        pushd server ; npm version --no-git-tag-version --allow-same-version ${{ needs.version.outputs.package }} ; popd
        pushd client ; npm version --no-git-tag-version --allow-same-version ${{ needs.version.outputs.package }} ; popd

    - name: Build VSCE package
      run: npx @vscode/vsce package

    - name: Upload beta VSCE package artifact to GitHub
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: vsce-package
        path: ghul-${{ needs.version.outputs.package }}.vsix

  publish_release_package:
    needs: [version, unit_tests]
    name: Publish release package

    timeout-minutes: 5

    runs-on: ubuntu-latest

    # if push and branch is main
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
    - name: Setup NodeJS
      uses: actions/setup-node@v6
      with:
        node-version: 'lts/*'

    - uses: actions/checkout@v6

    - name: Install dependencies
      run: npm install

    - name: Set version number in all package.json files
      run: |
        npm version --no-git-tag-version --allow-same-version ${{ needs.version.outputs.package }}
        pushd server ; npm version --no-git-tag-version --allow-same-version ${{ needs.version.outputs.package }} ; popd
        pushd client ; npm version --no-git-tag-version --allow-same-version ${{ needs.version.outputs.package }} ; popd

    - name: Build VSCE package
      run: npx @vscode/vsce package

    - name: Upload release VSCE package artifact to GitHub
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: vsce-package
        path: ghul-${{ needs.version.outputs.package }}.vsix

    - name: VSCE publish
      run: npx @vscode/vsce publish -p ${{ secrets.VSCE_PAT }}

    - name: Open VSX publish
      run: npx ovsx publish "ghul-${{ needs.version.outputs.package }}.vsix" -p ${{ secrets.OPEN_VSX_PAT }}

  create_release:
    needs: [version, unit_tests, publish_release_package]
    name: Create release
    runs-on: ubuntu-latest

    timeout-minutes: 5
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    permissions:
      contents: 'write'

    steps:
    - uses: actions/checkout@v6

    - name: Create changelog
      run: git log -1 --format="%s%n%n%b%n%n" >changelog.txt

    - name: Download release VSCE package artifact from GitHub
      uses: actions/download-artifact@v8
      with:
        name: vsce-package

    - name: Create release and upload VSIX
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ needs.version.outputs.tag }}" \
          --title "${{ needs.version.outputs.tag }}" \
          --notes-file changelog.txt \
          "ghul-${{ needs.version.outputs.package }}.vsix"
